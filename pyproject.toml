[project]
name = "teampermit"
version = "0.2.0"
description = "TeamPermit: secure multi-agent execution with task-scoped authorization"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openai>=1.59.7"]

[project.urls]
Repository = "https://github.com/ruihanzhu-Reina/TeamPermit"
Issues = "https://github.com/ruihanzhu-Reina/TeamPermit/issues"

[project.optional-dependencies]
benchmark = ["agentdojo==0.1.35"]

[project.scripts]
teampermit = "teampermit.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-subtests>=0.13", "ruff>=0.9", "build>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teampermit"]

[tool.uv.sources]
agentdojo = { path = "third_party/agentdojo", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E731"]
