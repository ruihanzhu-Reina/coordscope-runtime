[project]
name = "coordscope"
version = "0.3.0"
description = "Process-isolated agent execution with host policies and a durable effect ledger"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openai>=1.59.7", "jsonschema>=4.23"]

[project.urls]
Repository = "https://github.com/ruihanzhu-Reina/coordscope-runtime"
Issues = "https://github.com/ruihanzhu-Reina/coordscope-runtime/issues"

[project.optional-dependencies]
agentdojo = ["agentdojo==0.1.35"]

[project.scripts]
coordscope = "coordscope.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-subtests>=0.13", "ruff>=0.9", "build>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coordscope"]

[tool.uv.sources]
agentdojo = { path = "third_party/agentdojo", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E731"]
